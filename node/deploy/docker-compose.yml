# Deploy: put this file on the VDS and run `docker compose up -d` — no
# config file needed, the node generates everything (admin login, per-user
# secrets) into the rookery_data volume on first start. The generated admin
# password is printed once to `docker compose logs`; log in at
# http://<this-host>:8080/admin (or through Caddy, see the README) to create
# users and copy their rookery:// links.
#
# network_mode: host is required, not optional — pion's ICE agent gathers
# host candidates from the container's own network interfaces. Under normal
# bridge networking those would be Docker's internal 172.x addresses, which
# clients on the internet can't reach. Host networking makes the container
# see the VDS's real public interface instead.
services:
  rookery-node:
    image: ghcr.io/proxt/rookery-node:latest
    container_name: rookery-node
    restart: always
    network_mode: host
    volumes:
      - rookery_data:/data
      # Optional: drop a node.yaml here to override defaults (ports, dial
      # timeout, etc. — see node/configs/node.example.yaml). Not required.
      # - ./node.yaml:/etc/rookery/node.yaml:ro

volumes:
  rookery_data:
