<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rookery Admin</title>
<style>
  :root {
    --bg: #0b0d11;
    --surface: #171a21;
    --surface-2: #1e222b;
    --border: #2a2f3a;
    --text: #e5e7eb;
    --muted: #8b93a1;
    --accent: #4f7cff;
    --danger: #e0453f;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .wrap { width: 100%; max-width: 720px; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 9px 11px;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 500;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-secondary:hover { color: var(--text); }
  .btn-danger { background: transparent; border: 1px solid var(--border); color: var(--danger); }
  .btn-danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .field { margin-bottom: 14px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .error { font-size: 13px; color: var(--danger); margin-top: 10px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 10px; font-size: 13px; color: var(--ok);
    opacity: 0; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }

  #login-screen { display: flex; min-height: 80vh; align-items: center; justify-content: center; }
  #login-card { width: 320px; }
  #login-card h1 { text-align: center; margin-bottom: 20px; }

  #dashboard { display: none; }
  header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  section { margin-bottom: 20px; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }

  .user-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .user-row:last-child { border-bottom: none; }
  .user-name { font-weight: 500; }
  .user-meta { font-size: 12px; color: var(--muted); }
  .user-actions { display: flex; gap: 8px; }
  .empty { color: var(--muted); font-size: 13px; padding: 12px 0; }

  .add-user-form { display: flex; gap: 8px; margin-top: 12px; }
  .add-user-form input { flex: 1; }

  .divider { height: 1px; background: var(--border); margin: 18px 0; }
</style>
</head>
<body>

<div id="login-screen" class="wrap">
  <div id="login-card" class="card">
    <h1>Rookery Admin</h1>
    <div class="field">
      <label>Логин</label>
      <input id="login-username" type="text" autocomplete="username" />
    </div>
    <div class="field">
      <label>Пароль</label>
      <input id="login-password" type="password" autocomplete="current-password" />
    </div>
    <button class="btn-primary" style="width:100%" onclick="login()">Войти</button>
    <div id="login-error" class="error" style="display:none"></div>
  </div>
</div>

<div id="dashboard" class="wrap">
  <header class="top">
    <h1>Rookery Admin</h1>
    <button class="btn-secondary" onclick="logout()">Выйти</button>
  </header>

  <div class="card">
    <section>
      <h2>Пользователи</h2>
      <div id="users-list"></div>
      <div class="add-user-form">
        <input id="new-user-name" type="text" placeholder="Название (например, «Ноутбук»)" />
        <button class="btn-primary" onclick="createUser()">Добавить</button>
      </div>
    </section>

    <div class="divider"></div>

    <section>
      <h2>Публичный адрес ноды</h2>
      <div class="field">
        <input id="public-addr" type="text" placeholder="https://vpn.example.com" />
        <div class="hint">Используется в ссылках профилей. Укажите домен, за которым стоит Caddy.</div>
      </div>
      <button class="btn-secondary" onclick="saveSettings()">Сохранить</button>
    </section>

    <div class="divider"></div>

    <section>
      <h2>Логин и пароль администратора</h2>
      <div class="field">
        <label>Текущий пароль</label>
        <input id="cred-current" type="password" autocomplete="current-password" />
      </div>
      <div class="field">
        <label>Новый логин (необязательно)</label>
        <input id="cred-username" type="text" autocomplete="username" />
      </div>
      <div class="field">
        <label>Новый пароль (необязательно)</label>
        <input id="cred-password" type="password" autocomplete="new-password" />
      </div>
      <button class="btn-secondary" onclick="updateCredentials()">Сохранить</button>
      <div id="cred-error" class="error" style="display:none"></div>
    </section>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
    credentials: "same-origin",
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(text || res.statusText);
  }
  const ct = res.headers.get("content-type") || "";
  return ct.includes("application/json") ? res.json() : null;
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}

function showDashboard() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  loadUsers();
  loadSettings();
}

function showLogin() {
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
}

async function login() {
  const username = document.getElementById("login-username").value;
  const password = document.getElementById("login-password").value;
  const errEl = document.getElementById("login-error");
  errEl.style.display = "none";
  try {
    await api("POST", "/admin/api/login", { username, password });
    showDashboard();
  } catch (e) {
    errEl.textContent = "Неверный логин или пароль";
    errEl.style.display = "block";
  }
}

async function logout() {
  try { await api("POST", "/admin/api/logout"); } catch (e) {}
  showLogin();
}

async function loadUsers() {
  const users = await api("GET", "/admin/api/users");
  const el = document.getElementById("users-list");
  el.innerHTML = "";
  if (!users || users.length === 0) {
    el.innerHTML = '<div class="empty">Пока нет ни одного пользователя</div>';
    return;
  }
  for (const u of users) {
    const row = document.createElement("div");
    row.className = "user-row";
    row.innerHTML = `
      <div>
        <div class="user-name">${escapeHtml(u.name)}</div>
        <div class="user-meta">${new Date(u.created_at).toLocaleString("ru-RU")}</div>
      </div>
      <div class="user-actions">
        <button class="btn-secondary" data-link="${escapeHtml(u.link)}" onclick="copyLink(this)">Скопировать ссылку</button>
        <button class="btn-danger" onclick="deleteUser('${u.id}')">Удалить</button>
      </div>
    `;
    el.appendChild(row);
  }
}

function copyLink(btn) {
  navigator.clipboard.writeText(btn.dataset.link).then(() => showToast("Ссылка скопирована"));
}

async function createUser() {
  const nameEl = document.getElementById("new-user-name");
  const name = nameEl.value.trim();
  if (!name) return;
  await api("POST", "/admin/api/users", { name });
  nameEl.value = "";
  loadUsers();
}

async function deleteUser(id) {
  if (!confirm("Удалить этого пользователя? Его ссылка перестанет работать.")) return;
  await api("DELETE", `/admin/api/users/${id}`);
  loadUsers();
}

async function loadSettings() {
  const s = await api("GET", "/admin/api/settings");
  document.getElementById("public-addr").value = s.public_addr || "";
}

async function saveSettings() {
  const public_addr = document.getElementById("public-addr").value.trim();
  await api("PUT", "/admin/api/settings", { public_addr });
  showToast("Сохранено");
  loadUsers();
}

async function updateCredentials() {
  const errEl = document.getElementById("cred-error");
  errEl.style.display = "none";
  const current_password = document.getElementById("cred-current").value;
  const new_username = document.getElementById("cred-username").value.trim();
  const new_password = document.getElementById("cred-password").value;
  try {
    await api("PUT", "/admin/api/credentials", { current_password, new_username, new_password });
    document.getElementById("cred-current").value = "";
    document.getElementById("cred-username").value = "";
    document.getElementById("cred-password").value = "";
    showToast("Сохранено");
  } catch (e) {
    errEl.textContent = "Не удалось сохранить: проверьте текущий пароль";
    errEl.style.display = "block";
  }
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

(async function init() {
  try {
    await api("GET", "/admin/api/session");
    showDashboard();
  } catch (e) {
    showLogin();
  }
})();
</script>
</body>
</html>
