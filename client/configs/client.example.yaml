# Copy to client.yaml and fill in real values. client.yaml is gitignored.
#
# The GUI doesn't need this file edited by hand: paste a rookery://sub/...
# link (from the panel — Users → your user → "Скопировать ссылку") into
# the Subscriptions tab and it does the rest. This file matters for the
# headless CLI, or if you'd rather configure by hand.

# Panel's public address, e.g. https://panel.example.com
panel_addr: "https://your-panel-hostname.example.com"

# Subscription token — decode it out of a rookery://sub/... link (it's the
# "t" field in the base64url JSON payload), or read it off the panel.
token: ""
token_env: ""

# Local SOCKS5 listener address.
socks_addr: "127.0.0.1:1080"

# Which of the subscription's nodes to use. Empty means "the first one the
# panel returns" — fine if the subscription only has one node.
node_id: ""

# DataChannel backpressure thresholds, in KB of bufferedAmount.
buffered_amount_low_kb: 256
buffered_amount_high_kb: 1024

# Ceiling for the reconnect exponential backoff, in seconds.
reconnect_max_backoff_seconds: 30

start_minimized: false
auto_start: false

# Routes all of the OS's traffic through a virtual network adapter instead
# of just apps configured for the SOCKS5 proxy above. Needs administrator
# rights (the GUI's exe manifest requests elevation; run the CLI as Admin).
system_wide: false

log_level: "info"
