# Deploy: put this file on the VDS and run `docker compose up -d` — no
# config file needed, the panel generates everything (admin login) into the
# rookery_panel_data volume on first start. The generated admin password is
# printed once to `docker compose logs` — log in at
# http://<this-host>:8090/admin (or through Caddy, see the README) to set
# your public address, add nodes, and create users/subscriptions.
#
# Unlike the node, the panel does plain HTTP (no WebRTC/ICE), so it doesn't
# need host networking — a normal published port is fine.
#
# watchtower polls ghcr.io every 5 minutes and restarts rookery-panel on a
# new :latest — no manual `docker compose pull && up -d` after a push.
# Restarting briefly drops the panel (a few seconds); active client
# sessions on the node are unaffected, since the node doesn't depend on the
# panel being reachable to keep relaying already-issued tokens.
services:
  rookery-panel:
    image: ghcr.io/proxt/rookery-panel:latest
    container_name: rookery-panel
    restart: always
    ports:
      - "127.0.0.1:8090:8090"
    labels:
      # Required for the scoped watchtower below to find this container at
      # all — WATCHTOWER_SCOPE filters targets by this label, not just by
      # name; without it watchtower silently scans zero containers.
      - "com.centurylinklabs.watchtower.scope=rookery-panel"
    volumes:
      - rookery_panel_data:/data
      # Optional: drop a panel.yaml here to override defaults.
      # - ./panel.yaml:/etc/rookery/panel.yaml:ro

  watchtower:
    image: containrrr/watchtower
    container_name: rookery-panel-watchtower
    restart: always
    environment:
      # containrrr/watchtower hasn't shipped a new image since late 2023;
      # its bundled Docker client auto-negotiates down to API 1.25 against
      # modern Docker Engine, which then rejects it (min supported 1.40).
      # Pin a version watchtower's client actually understands.
      - DOCKER_API_VERSION=1.43
      # If the panel and a node ever share a host, each watchtower would
      # otherwise see the other as a stale copy of itself and kill it.
      # --scope keeps this instance to its own labeled container.
      - WATCHTOWER_SCOPE=rookery-panel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup rookery-panel

volumes:
  rookery_panel_data:
